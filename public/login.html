<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Siddhartha Patel Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d16;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 242, 254, 0.15);
      text-align: center;
    }
    .login-brand {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .login-brand span { color: var(--accent-cyan); }
    .login-sub {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 0.5rem;
    }
    .form-control {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }
    .pwd-wrapper {
      position: relative;
    }
    .pwd-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .pwd-toggle:hover { color: var(--accent-cyan); }
    .error-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 0.75rem;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .btn-login {
      width: 100%;
      padding: 0.9rem;
      background: var(--grad-primary);
      border: none;
      border-radius: 12px;
      color: #090d16;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.5);
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.88rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent-cyan); }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand">Sid<span>.</span> CMS Login</div>
    <p class="login-sub">Secure Portal for Siddhartha Patel Portfolio</p>

    <div id="error-box" class="error-alert">❌ Invalid Email or Password. Please try again.</div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Admin Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="Enter admin email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="pwd-wrapper">
          <input type="password" id="password" class="form-control" placeholder="Enter password" required>
          <button type="button" class="pwd-toggle" onclick="togglePasswordVisibility()">Show</button>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <span>Authenticate &amp; Enter CMS &rarr;</span>
      </button>
    </form>

    <a href="index.html" class="back-link">&larr; Back to Main Website</a>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.pwd-toggle');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        toggleBtn.textContent = 'Hide';
      } else {
        pwdInput.type = 'password';
        toggleBtn.textContent = 'Show';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pwd = document.getElementById('password').value;
      const errorBox = document.getElementById('error-box');

      if (email === 'siddharthapatel110@gmail.com' && pwd === '#%Gautam9845') {
        sessionStorage.setItem('portfolio_admin_auth', 'true');
        window.location.href = 'admin.html';
      } else {
        errorBox.style.display = 'block';
        setTimeout(() => { errorBox.style.display = 'none'; }, 4000);
      }
    }

    if (sessionStorage.getItem('portfolio_admin_auth') === 'true') {
      window.location.href = 'admin.html';
    }
  </script>
</body>
</html>
